{% extends 'base.html'%}
{% load my_tags %}
{% block content %}
<div class="main-content">
   <div class="welcome-text">
      <h1>Главная</h1>
      <p>Вы находитесь на сайте, предназначенном для продажи товаров.</p>
   </div>
   <div class="row">
      <div class="col-md-4">
         <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <div class="col">
               <div class="card shadow-sm">
                  <img src="{{ product_1.image | media_filter  }}">
                  <rect width="100%" height="100%" fill="#55595c"></rect>
                  <text x="50%" y="50%" fill="#eceeef" dy=".3em">{{ product_1.name }}</text>
                  <div class="card-body">
                     <p class="card-text">{{ product_1.description }}</p>
                     <div class="d-flex justify-content-between align-items-center">
                        <div class="btn-group">
                           <button type="button" class="btn btn-sm btn-outline-secondary"   >Назад</button>
                        </div>

                     </div>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </div>
</div>
{% endblock %}
